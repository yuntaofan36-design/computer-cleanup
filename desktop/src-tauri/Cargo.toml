[package]
name = "qingpan"
version = "0.1.0"
description = "Safe Windows disk cleanup"
authors = ["Qingpan"]
edition = "2021"

[lib]
name = "qingpan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Explicitly marks a non-production build that exercises destructive preview paths.
internal-write-preview = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
rayon = "1"
sha2 = "0.10"
dirs = "6"
parking_lot = "0.12"
sysinfo = "0.33"
tauri-plugin-updater = "^2"
tauri-plugin-process = "^2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Imaging", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"
