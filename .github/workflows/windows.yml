name: Windows builds
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.8.0, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter qingpan build
      - run: pnpm --filter qingpan-web build
      - run: pnpm --filter qingpan-server build
      - run: pnpm --filter qingpan-server test
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --target ${{ matrix.target }}
      - run: pnpm --filter qingpan tauri build --target ${{ matrix.target }}
        env:
          VITE_LICENSE_API: https://licenses.example.com
